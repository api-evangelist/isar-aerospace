aid: isar-aerospace
name: Isar Aerospace
description: 'Isar Aerospace is a European space launch service provider founded in
  2018 and headquartered in Ottobrunn near Munich, Germany. The company designs and
  manufactures Spectrum, a two-stage orbital small-lift launch vehicle capable of
  carrying up to 1,000 kg to low Earth orbit or up to 700 kg to Sun-synchronous orbit,
  using liquid oxygen and propane propulsion. Spectrum is fully developed and produced
  in-house with automated, scalable manufacturing including additive manufacturing
  and carbon-composite structures. Isar Aerospace offers dedicated, lead, and rideshare
  launch services for small and medium satellites and constellations. Backed by more
  than EUR 500 million in private capital from investors including Earlybird and HV
  Capital, the company employs over 400 people from nearly 50 nations and conducted
  the inaugural Spectrum test flight from Andoya Spaceport, Norway, on 30 March 2025.'
